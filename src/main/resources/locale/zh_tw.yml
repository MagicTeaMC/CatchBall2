# /ctb list 介面
catchableListTitle: "<bold>捕捉清單設置"
prevPage: "<green>上一頁"
nextPage: "<green>下一頁"
currentPage: "<yellow>目前頁面： <green>{PAGE}"
guiSkullLore:
  - "<gold>顯示名稱: {ENTITY}"
  - "<gold>捕捉狀態: {CATCHABLE}"

# 插件特殊物品設定
Items:
  CatchBall:
    DisplayName: "<green>生物捕捉球"
    Lore:
      - "<dark_gray><strikethrough>－－－－－－－－－－－－－－"
      - "<gray>使用工作臺將金雞蛋塞滿即可合成。"
      - "<gold>使用方式: 將捕捉球以雪球方式丟向生物即可。"
      - "<red>請注意: 不要捕捉已擁有 NBT 的生物，以免造成錯誤。"
      - "<dark_gray><strikethrough>－－－－－－－－－－－－－－"

  DropItem:
    DisplayName: "<gold>金雞蛋"
    Lore:
      - "<gray>破壞方塊,殺生物,雞生蛋時會有 <yellow>{PERCENT}% <gray>機率掉落"
      - "<gray>可用於合成捕捉球"

# 捕捉掉落頭顱敘述
DropSkullLore:
  - "<yellow>生物種類: <green>{ENTITY}"
  - "<yellow>抓捕者: <green>{PLAYER}"
  - "<yellow>抓捕時間: <green>{TIME}"
  - "<yellow>抓捕地點: <green>{LOCATION}"

ReloadFailed: "<red>設定重新載入失敗：{REASON}"

