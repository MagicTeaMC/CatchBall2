# CatchBall by MilkTeaMC and contributors
# Matrix Support Chat: https://matrix.to/#/#maoyue-dev:matrix.org
# Modrinth: https://modrinth.com/plugin/catchball
# Source code: https://github.com/MagicTeaMC/CatchBall2
# Configuration changes are loaded with /ctb reload.
# Legacy settings are migrated automatically; the original is saved as config.yml.bak.
config-version: 2

messages:
  # Language file in locale/: en, zh_tw, zh_cn, or a custom file name.
  locale: en

capture:
  # Entity names available on the running server. An empty list disables capture.
  catchable-entities:
    - SHEEP
  # Allow capturing a tamed entity whose owner is missing.
  allow-ownerless-tamed: true
  # Failure probability, from 0.0 (never fail) to 1.0 (always fail).
  fail-rate: 0.0
  # Bukkit sound name, or false to disable.
  success-sound: ENTITY_ARROW_HIT_PLAYER
  particles:
    enabled: false
    type: CAMPFIRE_COSY_SMOKE

drops:
  enabled: true
  # Permission requirement applies to ENTITY and BLOCK methods.
  require-permission: false
  # Percentage from 0 to 100. Legacy values such as "50%" are migrated.
  chance: 50
  material: EGG
  # CHICKEN: egg laying; ENTITY: player kills; BLOCK: non-creative block breaks.
  method: CHICKEN
  entity-type: CHICKEN
  block-type: DIAMOND_ORE

items:
  # 0 disables custom model data. Names and lore remain in locale/*.yml.
  # Changing item appearance can prevent old items from matching exact recipes.
  catch-ball:
    custom-model-data: 0
  drop-item:
    custom-model-data: 0

recipe:
  enabled: true
  # Each character maps to a material, a list of materials, or DROPITEM.
  ingredients:
    I: DROPITEM
  # One to three rows of equal width, with one to three characters per row.
  shape:
    - "III"
    - "III"
    - "III"

integrations:
  residence:
    enabled: true
    flags:
      - animalkilling
  grief-prevention:
    enabled: true
    flags:
      - Access
  lands:
    enabled: true
  red-protect:
    enabled: true
  simple-claim-system:
    enabled: true
  towny:
    enabled: true
  placeholder-api:
    enabled: true
  mythic-mobs:
    enabled: true
